name: mesocham
description: "A responsive Fossil Race demo for Mesozoic Champions."

version: 0.0.18

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/species_cards/
    - assets/companions/
    - assets/dinos/
    - assets/dinos/closeUps/
